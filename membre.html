<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✧･ﾟ Profil ﾟ･✧ | CHIBI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#d9c2ff;
    --purple:#a988e8;
    --blue:#c9b6ff;
    --cyan:#e0d0ff;
    --yellow:#f3e6ff;
    --hotpink:#9b6bd6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Montserrat',sans-serif;
    background:
      radial-gradient(circle at 20% 20%, #ecdcff 0%, transparent 45%),
      radial-gradient(circle at 80% 10%, #ddd0ff 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #e6d9ff 0%, transparent 50%),
      linear-gradient(135deg, #e4d6ff 0%, #ecdcff 40%, #f2e8ff 70%, #ded0f7 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    position:relative;
    padding-bottom:80px;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    opacity:0;
    transition:opacity 1s ease;
    background:
      radial-gradient(circle at 20% 20%, #2a3568 0%, transparent 45%),
      radial-gradient(circle at 80% 10%, #1f2a5c 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #232f66 0%, transparent 50%),
      linear-gradient(135deg, #131a3a 0%, #1a2350 40%, #202b5e 70%, #161d42 100%);
  }
  body.dark::after{ opacity:1; }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><g fill='white'><path d='M20 4 L23 15 L34 15 L25 22 L28 33 L20 26 L12 33 L15 22 L6 15 L17 15 Z'/><circle cx='90' cy='30' r='2.2'/><circle cx='60' cy='70' r='1.6'/><path d='M110 90 L112 96 L118 96 L113 100 L115 106 L110 102 L105 106 L107 100 L102 96 L108 96 Z'/><circle cx='25' cy='110' r='1.8'/><circle cx='75' cy='120' r='2.4'/><circle cx='130' cy='60' r='1.5'/></g></svg>");
    background-size:140px 140px;
    background-repeat:repeat;
    opacity:.55;
    animation:drift 40s linear infinite;
  }
  @keyframes drift{
    0%{background-position:0 0; opacity:.4;}
    50%{opacity:.65;}
    100%{background-position:-280px 280px; opacity:.4;}
  }

  .sparkle{
    position:fixed;
    pointer-events:none;
    font-size:28px;
    color:#ffffff;
    opacity:.9;
    animation:float 6s ease-in-out infinite;
    z-index:0;
    filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px rgba(255,255,255,.7));
    user-select:none;
  }
  @keyframes float{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    25%{transform:translate(10px,-18px) rotate(10deg);}
    50%{transform:translate(-6px,-28px) rotate(-8deg);}
    75%{transform:translate(-14px,-12px) rotate(6deg);}
  }

  .marquee-wrap{
    width:100%;
    background:linear-gradient(90deg,var(--hotpink),var(--purple),var(--pink),var(--hotpink));
    background-size:300% 100%;
    animation:gradientshift 6s linear infinite;
    overflow:hidden;
    white-space:nowrap;
    border-bottom:4px solid #fff;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    position:relative;
    z-index:2;
  }
  @keyframes gradientshift{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
  }
  .marquee{
    display:inline-block;
    padding:8px 0;
    color:#fff;
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:1px;
    text-shadow:0 0 6px rgba(255,255,255,.8), 2px 2px 0 rgba(0,0,0,.15);
    animation:scroll 18s linear infinite;
  }
  @keyframes scroll{
    0%{transform:translateX(100vw);}
    100%{transform:translateX(-100%);}
  }

  .topbar{
    max-width:935px;
    margin:0 auto;
    padding:14px 20px 0;
    position:relative;
    z-index:2;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .backlink{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:13px;
    color:#7d5cc7;
    text-decoration:none;
    background:rgba(255,255,255,.65);
    padding:7px 14px;
    border-radius:20px;
    box-shadow:0 2px 8px rgba(140,90,200,.2);
    transition:color .7s ease, background .7s ease, transform .15s ease;
  }
  .backlink:hover{ transform:translateY(-1px); }
  body.dark .backlink{ color:#c7d2f5; background:rgba(28,36,82,.6); }

  main{
    max-width:600px;
    margin:0 auto;
    padding:22px 20px 40px;
    position:relative;
    z-index:2;
  }

  .profile-header{
    display:flex;
    align-items:center;
    gap:28px;
    padding:24px 10px 30px;
    border-bottom:2px solid rgba(255,255,255,.6);
    transition:border-color .7s ease;
  }
  body.dark .profile-header{ border-color:rgba(255,255,255,.12); }
  @media (max-width:480px){
    .profile-header{ flex-direction:column; align-items:center; text-align:center; }
  }

  .avatar-ring{
    flex-shrink:0;
    width:150px;
    height:150px;
    border-radius:50%;
    padding:5px;
    background:conic-gradient(from 210deg, #ffd76b, var(--hotpink), var(--purple), var(--pink), #ffd76b);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 18px rgba(140,90,200,.3);
  }
  .avatar-ring .avatar-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:56px;
    overflow:hidden;
  }
  body.dark .avatar-ring .avatar-inner{ background:#1c2452; }
  .avatar-ring .avatar-inner img{
    width:80%;
    height:80%;
    object-fit:contain;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));
  }

  .profile-meta{ flex:1; min-width:0; }
  .profile-name-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:16px;
  }
  @media (max-width:480px){
    .profile-name-row{ justify-content:center; }
  }
  .profile-username{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:24px;
    color:#5a2d82;
    transition:color .7s ease;
    word-break:break-word;
  }
  body.dark .profile-username{ color:#dbe2ff; }

  .pf-btn{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:13px;
    border:none;
    border-radius:10px;
    padding:8px 16px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,#7289da,#5865f2);
    box-shadow:0 3px 0 rgba(0,0,0,.12);
    transition:transform .1s ease, background .7s ease;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .pf-btn:active{ transform:translateY(2px); }

  .stats-row{
    display:flex;
    gap:34px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  @media (max-width:480px){
    .stats-row{ justify-content:center; }
  }
  .stat{
    font-family:'Montserrat',sans-serif;
    font-size:15px;
    color:#5a2d82;
    transition:color .7s ease;
  }
  body.dark .stat{ color:#dbe2ff; }
  .stat b{ font-weight:800; }

  .bio{
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    color:#7a5aa8;
    line-height:1.5;
    max-width:420px;
    transition:color .7s ease;
  }
  body.dark .bio{ color:#b7c3f5; }
  .badge-taken2{
    display:inline-block;
    background:linear-gradient(135deg,#b498e0,#8064c9);
    color:#fff;
    font-size:11px;
    font-weight:700;
    padding:3px 10px;
    border-radius:20px;
    margin-top:6px;
  }

  .tabs{
    display:flex;
    justify-content:center;
    gap:64px;
    border-top:2px solid rgba(255,255,255,.6);
    margin-top:6px;
    transition:border-color .7s ease;
  }
  body.dark .tabs{ border-color:rgba(255,255,255,.12); }
  .tab{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:1px;
    color:#5a2d82;
    padding:14px 4px;
    border-top:2px solid #5a2d82;
    margin-top:-2px;
    transition:color .7s ease, border-color .7s ease;
  }
  body.dark .tab{ color:#dbe2ff; border-top-color:#dbe2ff; }

  .single-post-wrap{
    padding:20px 0 0;
  }
  .single-post{
    position:relative;
    aspect-ratio:1/1;
    width:100%;
    border-radius:18px;
    overflow:hidden;
    background:linear-gradient(145deg, var(--pink), var(--blue));
    box-shadow:0 8px 20px rgba(140,90,200,.25);
    border:3px solid rgba(255,255,255,.85);
  }
  .single-post img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:12%;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));
  }
  .single-post-caption{
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    color:#7a5aa8;
    text-align:center;
    margin-top:10px;
    transition:color .7s ease;
  }
  body.dark .single-post-caption{ color:#b7c3f5; }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    font-family:'Montserrat',sans-serif;
    color:#a98fd0;
    transition:color .7s ease;
  }
  body.dark .empty-state{ color:#8b9bd8; }
  .empty-state .big{
    font-size:44px;
    margin-bottom:12px;
  }

  .loading-msg{
    text-align:center;
    padding:60px 20px;
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    color:#7d5cc7;
    transition:color .7s ease;
  }
  body.dark .loading-msg{ color:#c7d2f5; }

  footer{
    text-align:center;
    font-family:'Montserrat',sans-serif;
    color:#8a4fb8;
    font-size:13px;
    padding:20px;
    position:relative;
    z-index:2;
    transition:color .7s ease;
  }
  body.dark footer{ color:#b7c3f5; }

  #themeToggle{
    position:fixed;
    top:16px;
    right:16px;
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.8);
    background:rgba(169,136,232,.35);
    color:#5a3d8a;
    font-size:17px;
    cursor:pointer;
    z-index:40;
    opacity:.75;
    transition:opacity .2s, transform .3s, background .3s, color .3s;
  }
  #themeToggle:hover{opacity:1; transform:rotate(15deg);}
  body.dark #themeToggle{
    background:rgba(107,127,215,.35);
    color:#cdd6fa;
    border-color:rgba(255,255,255,.4);
  }
</style>
</head>
<body>

<div class="marquee-wrap">
  <div class="marquee">✧･ﾟ: *✧･ﾟ:* PROFIL DU MEMBRE *:･ﾟ✧*:･ﾟ✧　　un chibi, un pseudo, une carte à lui/elle　　★彡</div>
</div>

<div class="topbar">
  <a class="backlink" href="index.html">← accueil</a>
</div>

<main id="main">
  <div class="loading-msg">chargement du profil... ✧</div>
</main>

<footer>site pensé par Lucas &amp; fait par Claude — Chibi</footer>

<button id="themeToggle" title="mode sombre">🌙</button>

<script src="chibi-data.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAZWsfrqCrmDFyvG5RNdQacEUbkAq2qXqM',
  authDomain: 'chibi-be98b.firebaseapp.com',
  databaseURL: 'https://chibi-be98b-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'chibi-be98b',
  storageBucket: 'chibi-be98b.firebasestorage.app'
};

let db = null;
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
}catch(e){ db = null; }

const mainEl = document.getElementById('main');

function getChibiIdFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return params.get('id');
}

function chibiImage(id, customChibis){
  return customChibis[id] || (typeof BASE_CHIBI_DATA !== 'undefined' ? BASE_CHIBI_DATA[id] : null) || '';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderNotFound(){
  mainEl.innerHTML = `
    <div class="empty-state">
      <div class="big">🔍</div>
      Profil introuvable ✧<br>
      Ce chibi n'a peut-être pas encore été adopté, ou le lien est invalide.<br><br>
      <a class="backlink" href="index.html">← retour à l'accueil</a>
    </div>`;
}

async function renderProfile(){
  const chibiId = getChibiIdFromUrl();
  if(!chibiId){ renderNotFound(); return; }

  if(!db){
    mainEl.innerHTML = '<div class="empty-state"><div class="big">⚠</div>la base de données n\u2019est pas accessible pour le moment.</div>';
    return;
  }

  const [aSnap, cSnap, hSnap] = await Promise.all([
    db.ref('assignments/' + chibiId).get().catch(()=>null),
    db.ref('customChibis').get().catch(()=>null),
    db.ref('hiddenChibis/' + chibiId).get().catch(()=>null),
  ]);

  const entry = aSnap && aSnap.exists() ? aSnap.val() : null;
  const isHidden = hSnap && hSnap.exists() ? hSnap.val() : false;

  if(!entry || isHidden){
    renderNotFound();
    return;
  }

  const customChibis = cSnap && cSnap.exists() ? cSnap.val() : {};
  const img = chibiImage(chibiId, customChibis);
  const username = entry.discordUsername || entry.name || 'quelqu\u2019un';
  const discordId = entry.discordId;

  mainEl.innerHTML = `
    <section class="profile-header">
      <div class="avatar-ring">
        <div class="avatar-inner">${img ? `<img src="${img}" alt="${escapeHtml(username)}">` : '🌸'}</div>
      </div>
      <div class="profile-meta">
        <div class="profile-name-row">
          <span class="profile-username">@${escapeHtml(username)}</span>
          ${discordId ? `<a class="pf-btn" href="https://discord.com/users/${encodeURIComponent(discordId)}" target="_blank" rel="noopener">🎮 voir sur Discord</a>` : ''}
        </div>
        <div class="stats-row">
          <div class="stat"><b>1</b> chibi</div>
          <div class="stat"><b>${escapeHtml(chibiId)}</b> id</div>
        </div>
        <div class="bio">
          ✧ membre de la communauté <b>CHIBI</b> ✧<br>
          a adopté ce chibi pour toujours.
          <div><span class="badge-taken2">adopté ★</span></div>
        </div>
      </div>
    </section>

    <div class="tabs">
      <div class="tab">▦ SON CHIBI</div>
    </div>

    <div class="single-post-wrap">
      <div class="single-post">
        ${img ? `<img src="${img}" alt="${escapeHtml(username)}">` : ''}
      </div>
      <div class="single-post-caption">@${escapeHtml(username)} × ${escapeHtml(chibiId)}</div>
    </div>
  `;
}

/* ---------- thème clair / sombre (partagé) ---------- */
const themeToggle = document.getElementById('themeToggle');
function applyTheme(dark){
  document.body.classList.toggle('dark', dark);
  themeToggle.textContent = dark ? '☀' : '🌙';
  themeToggle.title = dark ? 'mode clair' : 'mode sombre';
  try{ localStorage.setItem('theme', dark ? 'dark' : 'light'); }catch(e){}
}
themeToggle.addEventListener('click', () => {
  applyTheme(!document.body.classList.contains('dark'));
});
let savedTheme = null;
try{ savedTheme = localStorage.getItem('theme'); }catch(e){}
applyTheme(savedTheme === 'dark');

/* ---------- étoiles décoratives (partagées) ---------- */
const sparkleChars = ['★','✦','✧','☆','✶'];
for(let i=0;i<20;i++){
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.textContent = sparkleChars[i % sparkleChars.length];
  s.style.left = Math.random()*100 + 'vw';
  s.style.top = Math.random()*100 + 'vh';
  s.style.animationDelay = (Math.random()*6) + 's';
  s.style.animationDuration = (4 + Math.random()*5) + 's';
  s.style.fontSize = (14 + Math.random()*24) + 'px';
  document.body.appendChild(s);
}

renderProfile();
</script>
</body>
</html>
